[project]
name = "angomart-mcp"
version = "0.1.0"
description = "Unofficial MCP server for AngoMart (Angola): list stores, categories, and products."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Carlos Rasgado" }]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
angomart-mcp = "server:mcp.run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
